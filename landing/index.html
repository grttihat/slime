<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>soundslime</title>
  <meta name="description" content="친구가 직접 만든 슬라임을 공유했어요." />
  <meta name="theme-color" content="#000000" />

  <meta property="og:title" content="친구가 직접 만든 슬라임을 공유했어요" />
  <meta property="og:description" content="" />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://grttihat.github.io/slime/landing/" />
  <meta property="og:site_name" content="soundslime" />
  <meta property="og:image" content="https://grttihat.github.io/slime/landing/share-thumbnail.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="친구가 직접 만든 슬라임을 공유했어요" />
  <meta name="twitter:description" content="" />
  <meta name="twitter:image" content="https://grttihat.github.io/slime/landing/share-thumbnail.png" />

  <style>
    :root {
      --bg: #0d0d0f;
      --fg: #f4f4f5;
      --fg-muted: #a1a1aa;
      --border: #27272a;
      --card: #17171b;
    }
    @media (prefers-color-scheme: light) {
      :root {
        --bg: #fafafa;
        --fg: #1a1a1a;
        --fg-muted: #6b6b6b;
        --border: #ececec;
        --card: #ffffff;
      }
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { min-height: 100%; }
    body {
      background: var(--bg);
      color: var(--fg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                   "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    main {
      flex: 1 0 auto;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 48px 20px;
    }

    .panel {
      width: 100%;
      max-width: 420px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }

    .cta {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 220px;
      height: 48px;
      padding: 0 24px;
      background: var(--fg);
      color: var(--bg);
      border-radius: 999px;
      text-decoration: none;
      font-weight: 700;
      font-size: 15px;
    }

    .cta-note {
      display: block;
      color: var(--fg-muted);
      font-size: 13px;
      line-height: 1.6;
    }

    .cta-note a {
      color: var(--fg);
      text-decoration: underline;
    }

    .qr {
      background: #fff;
      padding: 10px;
      border-radius: 12px;
    }

    footer {
      flex-shrink: 0;
      padding: 24px 20px;
      border-top: 1px solid var(--border);
      background: var(--card);
      font-size: 12px;
      color: var(--fg-muted);
      text-align: center;
      line-height: 1.8;
    }

    footer a {
      color: var(--fg-muted);
      text-decoration: none;
    }

    footer a:hover { color: var(--fg); }
  </style>
</head>
<body>

  <main>
    <!-- Android — app installed → auto-open via intent URL; not
         installed → intent fallback_url → Play Store. -->
    <div id="share-handoff" class="panel" style="display:none;">
      <a id="share-open-app" class="cta" href="#">앱에서 열기</a>
      <span class="cta-note">
        앱이 없다면 <a id="share-store" href="#">Play 스토어</a>에서 설치하세요.
      </span>
    </div>

    <!-- iOS — no iOS build yet. -->
    <div id="ios-handoff" class="panel" style="display:none;">
      <div class="cta" style="pointer-events:none; opacity:0.85;">iOS 버전 준비 중</div>
      <span class="cta-note">
        iOS 앱은 곧 출시 예정이에요.<br />
        Android 폰에서 열면 공유받은 슬라임을 바로 만질 수 있어요.
      </span>
    </div>

    <!-- Desktop — QR of the current URL so the visitor can scan with
         their phone, plus a direct Play Store link. -->
    <div id="desktop-handoff" class="panel" style="display:none;">
      <span class="cta-note">
        스마트폰에서 Android 앱으로 공유받은 슬라임을 열 수 있어요.<br />
        아래 QR을 스캔하거나 Play 스토어 링크를 폰으로 전달하세요.
      </span>
      <img id="desktop-qr" class="qr" alt="QR 코드" width="160" height="160" />
      <a id="desktop-store" class="cta" href="#" style="font-size:13px; height:40px; min-width:160px;">Play 스토어 열기</a>
    </div>
  </main>

  <footer>
    <a href="https://grttihat.github.io/slimong-policy/">개인정보처리방침</a>
    &nbsp;·&nbsp;
    <a href="mailto:grttihat@gmail.com">문의</a>
    <br />
    © 2026 soundslime. All rights reserved.
  </footer>

  <script>
    // Share-link hand-off. Supports two URL formats:
    //   • ?d=<base64>  — raw payload inline (legacy)
    //   • ?s=<code>    — 8-char Supabase share_links lookup (new)
    (function () {
      var SUPABASE_URL = 'https://oknbmhqnbryrfbykhqde.supabase.co';
      var SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9rbmJtaHFuYnJ5cmZieWtocWRlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc5MDAxNzUsImV4cCI6MjEwMzQ3NjE3NX0.OBFIussDgCklpCYl9Py07jr8Ir5GvUBXKlzMNtY8TGc';
      var STORE_URL = 'https://play.google.com/store/apps/details?id=io.wakbu.slime';

      function openAppWithPayload(payload) {
        var ua = navigator.userAgent || '';
        var isAndroid = /Android/i.test(ua);
        var isIOS = /iPad|iPhone|iPod/.test(ua) && !(/Windows/.test(ua));
        var isMobile = isAndroid || isIOS;

        // ── Desktop ────────────────────────────
        if (!isMobile) {
          var panel = document.getElementById('desktop-handoff');
          var store = document.getElementById('desktop-store');
          var qrImg = document.getElementById('desktop-qr');
          var qrUrl = 'https://api.qrserver.com/v1/create-qr-code/?size=160x160&data=' +
            encodeURIComponent(window.location.href);
          if (panel) panel.style.display = 'flex';
          if (store) store.href = STORE_URL;
          if (qrImg) qrImg.src = qrUrl;
          return;
        }

        // ── iOS ────────────────────────────────
        if (isIOS) {
          var iosPanel = document.getElementById('ios-handoff');
          if (iosPanel) iosPanel.style.display = 'flex';
          return;
        }

        // ── Android ────────────────────────────
        var customScheme = 'io.wakbu.slime://share?d=' + encodeURIComponent(payload);
        var intentUrl =
          'intent://grttihat.github.io/slime/landing/?d=' + encodeURIComponent(payload) +
          '#Intent;scheme=https;package=io.wakbu.slime;' +
          'S.browser_fallback_url=' + encodeURIComponent(STORE_URL) +
          ';end;';

        var handoff = document.getElementById('share-handoff');
        var openApp = document.getElementById('share-open-app');
        var storeLink = document.getElementById('share-store');
        if (handoff) handoff.style.display = 'flex';
        if (openApp) openApp.href = customScheme;
        if (storeLink) storeLink.href = STORE_URL;

        setTimeout(function () {
          try { window.location.href = intentUrl; } catch (_) {}
          setTimeout(function () {
            try { window.location.href = customScheme; } catch (_) {}
          }, 1500);
        }, 50);
      }

      function resolveCodeThenOpen(code) {
        fetch(
          SUPABASE_URL + '/rest/v1/share_links?code=eq.' +
            encodeURIComponent(code) + '&select=payload',
          {
            headers: {
              apikey: SUPABASE_ANON,
              Authorization: 'Bearer ' + SUPABASE_ANON
            }
          }
        )
          .then(function (r) { return r.ok ? r.json() : []; })
          .then(function (rows) {
            var payload = rows && rows[0] && rows[0].payload;
            if (!payload) return;
            var p = new URLSearchParams(window.location.search);
            p.delete('s');
            p.set('d', payload);
            window.history.replaceState({}, '', window.location.pathname + '?' + p.toString());
            openAppWithPayload(payload);
          })
          .catch(function () {});
      }

      try {
        var params = new URLSearchParams(window.location.search);
        var d = params.get('d');
        var s = params.get('s');
        if (d) {
          openAppWithPayload(d);
        } else if (s && /^[A-Za-z0-9_-]+$/.test(s)) {
          resolveCodeThenOpen(s);
        }
      } catch (e) { /* malformed URL — stay on empty state */ }
    })();
  </script>

</body>
</html>
